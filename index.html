<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web To Lead Form</title>
    <link rel="stylesheet" href="webs.css" />
    <script src="webs.js"></script>
    <script src="https://www.google.com/recaptcha/api.js"></script>
  </head>
  <body>
    <h1>Create Lead</h1>
    <form
      action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00Dg800000RUkyr"
      method="POST"
      onsubmit="beforesubmit(event)"
    >
      <input
        type="hidden"
        name="captcha_settings"
        value='{"keyname":"webtolead","fallback":"true","orgId":"00Dg800000RUkyr","ts":""}'
      />
      <input type="hidden" name="oid" value="00Dg800000RUkyr" />
      <input
        type="hidden"
        name="retURL"
        value="https://prashanthgatadi.github.io/webs/websthanks.html"
      />

      <input type="hidden" name="Lead_Date__c" class="outputdate" />
      <label for="first_name">First Name</label
      ><input
        id="first_name"
        maxlength="40"
        name="first_name"
        size="20"
        type="text"
        required="true"
      /><br />

      <label for="last_name">Last Name</label
      ><input
        id="last_name"
        maxlength="80"
        name="last_name"
        size="20"
        type="text"
        required="true"
      /><br />

      <label for="email">Email</label
      ><input
        id="email"
        maxlength="80"
        name="email"
        size="20"
        type="text"
        required="true"
      /><br />
      <label for="email">Lead Date:</label>
      <input type="Date" class="inputdate" required="true" /><br />
      <!-- Lead Date:<span class="dateInput dateOnlyInput"
        ><input
          id="00Ng800001Kdr3d"
          name="00Ng800001Kdr3d"
          size="12"
          type="text" /></span
      ><br /> -->

      <!-- <input
        type="hidden"
        id="lead_source"
        name="lead_source"
        value="Web"
        required="true"
      /><br /> -->
      <div
        class="g-recaptcha"
        data-sitekey="6LcUFBguAAAAAN0gh4RBHj17yZKyhzlg6om_FPlP"
        data-callback="captchasucess"
      ></div>
      <br />
      <input class="submit" type="submit" name="submit" />
    </form>
  </body>
</html>
